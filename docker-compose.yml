services:
  web:
    build: .
    ports:
      - "5000:5000"
    container_name: my-web
    depends_on:
      - db

  db:
    image: postgres:16
    container_name: my-db
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydatabase
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data:
