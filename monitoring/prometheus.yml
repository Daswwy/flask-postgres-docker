global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']


  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          host: ubuntu-local
      - targets: ['9.205.152.116:9100']
        labels:
          host: azure-vm
